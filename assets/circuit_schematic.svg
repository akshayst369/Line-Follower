<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="arduinoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008184"/>
      <stop offset="100%" stop-color="#005C5E"/>
    </linearGradient>
    <linearGradient id="driverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2430"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#196127"/>
    </linearGradient>
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#6e40c9"/>
    </linearGradient>
    <linearGradient id="motorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#9e6a03"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="550" y="45" text-anchor="middle" fill="#58a6ff" font-size="24" font-weight="bold" letter-spacing="1.5">ARDUINO 2WD LINE FOLLOWER ROBOT</text>
  <text x="550" y="72" text-anchor="middle" fill="#8b949e" font-size="14">SYSTEM WIRING ARCHITECTURE &amp; POWER DISTRIBUTION</text>

  <!-- ==================== ARDUINO UNO ==================== -->
  <g filter="url(#shadow)">
    <rect x="360" y="110" width="380" height="280" rx="12" fill="url(#arduinoGrad)" stroke="#388bfd" stroke-width="2"/>
    <text x="550" y="145" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">ARDUINO UNO R3</text>
    <text x="550" y="168" text-anchor="middle" fill="#79c0ff" font-size="12">ATmega328P Microcontroller</text>

    <!-- Arduino Pins Left (Power / Analog) -->
    <rect x="375" y="190" width="160" height="180" rx="6" fill="#0b2829" opacity="0.8"/>
    <text x="455" y="212" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">POWER / ANALOG</text>
    <text x="390" y="240" fill="#f0f6fc" font-size="12">VIN  &#8592; +13.2V (Switched)</text>
    <text x="390" y="265" fill="#f0f6fc" font-size="12">GND  &#8596; Common Ground</text>
    <text x="390" y="290" fill="#f0f6fc" font-size="12">5V   &#8594; VCC to Sensors &amp; L293D</text>
    <text x="390" y="320" fill="#7ee787" font-size="12">A0   &#8592; Left Sensor (OUT)</text>
    <text x="390" y="345" fill="#7ee787" font-size="12">A1   &#8592; Right Sensor (OUT)</text>

    <!-- Arduino Pins Right (Digital PWM) -->
    <rect x="565" y="190" width="160" height="180" rx="6" fill="#0b2829" opacity="0.8"/>
    <text x="645" y="212" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">DIGITAL / PWM</text>
    <text x="580" y="240" fill="#ffa657" font-size="12">D5  &#8594; IN1 (Left Dir)</text>
    <text x="580" y="265" fill="#ffa657" font-size="12">D6  &#8594; IN2 (Left Dir)</text>
    <text x="580" y="290" fill="#ffa657" font-size="12">D9~ &#8594; ENA (Left PWM)</text>
    <text x="580" y="315" fill="#ffa657" font-size="12">D10 &#8594; IN3 (Right Dir)</text>
    <text x="580" y="340" fill="#ffa657" font-size="12">D11 &#8594; IN4 (Right Dir)</text>
    <text x="580" y="360" fill="#ffa657" font-size="11">D3~ &#8594; ENB (Right PWM)</text>
  </g>

  <!-- ==================== IR SENSORS ==================== -->
  <!-- Left IR Sensor -->
  <g filter="url(#shadow)">
    <rect x="50" y="130" width="230" height="110" rx="10" fill="url(#sensorGrad)" stroke="#2ea043" stroke-width="1.5"/>
    <text x="165" y="158" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">LEFT IR SENSOR (LM393)</text>
    <text x="70" y="185" fill="#ffffff" font-size="12">VCC  &#8592; 5V (from Arduino)</text>
    <text x="70" y="205" fill="#ffffff" font-size="12">GND  &#8592; Common GND</text>
    <text x="70" y="225" fill="#7ee787" font-size="12" font-weight="bold">OUT  &#8594; Arduino Pin A0</text>
  </g>

  <!-- Right IR Sensor -->
  <g filter="url(#shadow)">
    <rect x="50" y="270" width="230" height="110" rx="10" fill="url(#sensorGrad)" stroke="#2ea043" stroke-width="1.5"/>
    <text x="165" y="298" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">RIGHT IR SENSOR (LM393)</text>
    <text x="70" y="325" fill="#ffffff" font-size="12">VCC  &#8592; 5V (from Arduino)</text>
    <text x="70" y="345" fill="#ffffff" font-size="12">GND  &#8592; Common GND</text>
    <text x="70" y="365" fill="#7ee787" font-size="12" font-weight="bold">OUT  &#8594; Arduino Pin A1</text>
  </g>

  <!-- ==================== BATTERY & SWITCH ==================== -->
  <g filter="url(#shadow)">
    <!-- Battery Pack -->
    <rect x="50" y="440" width="230" height="120" rx="10" fill="url(#batteryGrad)" stroke="#a371f7" stroke-width="1.5"/>
    <text x="165" y="470" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">13.2V BATTERY PACK</text>
    <text x="165" y="490" text-anchor="middle" fill="#d2a8ff" font-size="12">(3x 18650 Li-ion / LiFePO4)</text>
    <text x="70" y="520" fill="#ff7b72" font-size="13" font-weight="bold">(+) Positive &#8594; Switch</text>
    <text x="70" y="542" fill="#79c0ff" font-size="13" font-weight="bold">(-) Negative &#8594; Common GND</text>

    <!-- Rocker Switch -->
    <rect x="110" y="590" width="110" height="60" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
    <text x="165" y="618" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">ON / OFF</text>
    <text x="165" y="638" text-anchor="middle" fill="#8b949e" font-size="11">Rocker Switch</text>
  </g>

  <!-- ==================== L293D MOTOR DRIVER ==================== -->
  <g filter="url(#shadow)">
    <rect x="360" y="450" width="380" height="280" rx="12" fill="url(#driverGrad)" stroke="#8b949e" stroke-width="2"/>
    <text x="550" y="482" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">L293D DUAL H-BRIDGE DRIVER</text>
    <text x="550" y="502" text-anchor="middle" fill="#8b949e" font-size="12">Motor Voltage &amp; Direction Control</text>

    <!-- Left Side: Power & Left Motor Out -->
    <rect x="380" y="520" width="160" height="190" rx="6" fill="#161b22"/>
    <text x="460" y="542" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">POWER / MOTOR A</text>
    <text x="395" y="568" fill="#ff7b72" font-size="12">VCC2 (12V) &#8592; +13.2V</text>
    <text x="395" y="593" fill="#79c0ff" font-size="12">GND &#8596; Common GND</text>
    <text x="395" y="618" fill="#58a6ff" font-size="12">VCC1 (5V) &#8592; Arduino 5V</text>
    <text x="395" y="650" fill="#d29922" font-size="12" font-weight="bold">OUT1 &#8594; Left Motor (+)</text>
    <text x="395" y="675" fill="#d29922" font-size="12" font-weight="bold">OUT2 &#8594; Left Motor (-)</text>

    <!-- Right Side: Control & Right Motor Out -->
    <rect x="560" y="520" width="160" height="190" rx="6" fill="#161b22"/>
    <text x="640" y="542" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">INPUTS / MOTOR B</text>
    <text x="575" y="568" fill="#ffa657" font-size="12">IN1, IN2 &#8592; From D5, D6</text>
    <text x="575" y="593" fill="#ffa657" font-size="12">ENA &#8592; From D9 (PWM)</text>
    <text x="575" y="618" fill="#ffa657" font-size="12">IN3, IN4 &#8592; From D10, D11</text>
    <text x="575" y="650" fill="#d29922" font-size="12" font-weight="bold">OUT3 &#8594; Right Motor (+)</text>
    <text x="575" y="675" fill="#d29922" font-size="12" font-weight="bold">OUT4 &#8594; Right Motor (-)</text>
  </g>

  <!-- ==================== BO MOTORS ==================== -->
  <!-- Left Motor -->
  <g filter="url(#shadow)">
    <rect x="820" y="210" width="230" height="130" rx="10" fill="url(#motorGrad)" stroke="#e3b341" stroke-width="1.5"/>
    <text x="935" y="240" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">LEFT BO MOTOR</text>
    <text x="935" y="260" text-anchor="middle" fill="#fff8c5" font-size="12">Geared TT Motor (3-6V)</text>
    <text x="840" y="295" fill="#ffffff" font-size="12">Terminal A &#8592; L293D OUT1</text>
    <text x="840" y="320" fill="#ffffff" font-size="12">Terminal B &#8592; L293D OUT2</text>
  </g>

  <!-- Right Motor -->
  <g filter="url(#shadow)">
    <rect x="820" y="520" width="230" height="130" rx="10" fill="url(#motorGrad)" stroke="#e3b341" stroke-width="1.5"/>
    <text x="935" y="550" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">RIGHT BO MOTOR</text>
    <text x="935" y="570" text-anchor="middle" fill="#fff8c5" font-size="12">Geared TT Motor (3-6V)</text>
    <text x="840" y="605" fill="#ffffff" font-size="12">Terminal A &#8592; L293D OUT3</text>
    <text x="840" y="630" fill="#ffffff" font-size="12">Terminal B &#8592; L293D OUT4</text>
  </g>

  <!-- ==================== CONNECTING BUS LINES ==================== -->
  <!-- IR Left to Arduino A0 -->
  <path d="M 280 220 L 320 220 L 320 320 L 375 320" fill="none" stroke="#7ee787" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- IR Right to Arduino A1 -->
  <path d="M 280 360 L 340 360 L 340 345 L 375 345" fill="none" stroke="#7ee787" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Battery -> Switch -> VIN & L293D VCC2 -->
  <path d="M 165 560 L 165 590" fill="none" stroke="#ff7b72" stroke-width="3"/>
  <path d="M 220 620 L 300 620 L 300 240 L 375 240" fill="none" stroke="#ff7b72" stroke-width="2.5"/>
  <path d="M 300 568 L 380 568" fill="none" stroke="#ff7b72" stroke-width="2.5"/>

  <!-- Logic 5V Arduino to L293D VCC1 -->
  <path d="M 375 290 L 340 290 L 340 618 L 380 618" fill="none" stroke="#58a6ff" stroke-width="2"/>

  <!-- Arduino Controls to L293D Controls -->
  <path d="M 645 370 L 645 450" fill="none" stroke="#ffa657" stroke-width="3"/>

  <!-- L293D OUT1/OUT2 to Left Motor -->
  <path d="M 540 655 L 780 655 L 780 290 L 820 290" fill="none" stroke="#d29922" stroke-width="2.5"/>

  <!-- L293D OUT3/OUT4 to Right Motor -->
  <path d="M 720 660 L 820 660" fill="none" stroke="#d29922" stroke-width="2.5"/>

  <!-- Safety Warning Badge at bottom -->
  <rect x="250" y="740" width="600" height="30" rx="6" fill="#301c1c" stroke="#f85149" stroke-width="1"/>
  <text x="550" y="760" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="bold">⚠️ VOLTAGE SAFETY: Arduino code regulates 13.2V via PWM (45%-60%) to safeguard 3-6V BO motors</text>
</svg>
